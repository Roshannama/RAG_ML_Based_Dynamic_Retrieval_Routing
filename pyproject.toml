[project]
name = "rag-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Roshan",email = "roshannama53@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.136.3,<0.137.0",
    "uvicorn>=0.48.0,<0.49.0",
    "python-dotenv>=1.2.2,<2.0.0",

    "langchain (==1.3.2)",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-community>=0.4.2,<0.5.0",

    "langchain-groq>=1.1.2,<2.0.0",
    "langchain-google-genai>=4.2.4,<5.0.0",

    "langchain-pinecone>=0.2.13,<0.3.0",

    "pinecone==7.3.0",

    "langsmith>=0.8.8,<0.9.0",

    "huggingface (>=0.0.1,<0.0.2)",

    "langchain-huggingface (>=1.2.2,<2.0.0)",

    "sentence-transformers (>=5.5.1,<6.0.0)",

    "pydantic (>=2.13.4,<3.0.0)",

    "sqlalchemy (>=2.0.50,<3.0.0)",

    "pinecone-text (>=0.11.0,<0.12.0)",

    "rank-bm25 (>=0.2.2,<0.3.0)",

    "torch (>=2.12.0,<3.0.0)",

    "pypdf (>=6.13.2,<7.0.0)",

    "ragas (==0.4.3)",

    "datasets (>=5.0.0,<6.0.0)",

    "google-cloud-aiplatform (>=1.158.0,<2.0.0)",

    "langchain-google-vertexai (>=3.2.4,<4.0.0)",

    "numpy (>=2.5.2,<3.0.0)",

    "pandas (>=3.0.5,<4.0.0)",

    "joblib (>=1.6.0,<2.0.0)",

    "scikit-learn (>=1.9.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "rag_chatbot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
